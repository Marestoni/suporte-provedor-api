name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostgreSQL descartável para os testes de integração (banco temporário por execução)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SUPORTE_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test (unitários + integração)
        shell: bash
        run: |
          set -o pipefail
          dotnet test --no-build -c Release --verbosity normal | tee test-output.txt
          # Os testes de integração não podem ficar pulados (checklist de deploy do CLAUDE.md).
          if grep -Eq "Skipped: +[1-9]" test-output.txt; then
            echo "::error::Há testes pulados: os testes de integração precisam rodar no CI."
            exit 1
          fi